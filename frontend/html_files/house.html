<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/frontend/nysc-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<link rel="stylesheet" href="/frontend/css/base.css">
<link rel="stylesheet" href="/frontend/css/app.css">
<link rel="stylesheet" href="/frontend/css/extra.css">
<title>NYSC Companion · House</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#014a21">
<link rel="apple-touch-icon" href="/frontend/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NYSC">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<div class="view">
  <div id="topbar"></div>
  <p style="margin-top:18px"><a class="link" id="back" href="/houses">← Back to houses</a></p>
  <div class="notice show bad" id="error" role="alert" hidden></div>

  <div id="content" hidden>
    <div class="page-head" style="margin-top:12px">
      <div>
        <h1 id="h-title"></h1>
        <p id="h-meta"></p>
      </div>
      <div class="big-price num" id="h-price"></div>
    </div>

    <div class="house-layout">
      <div class="col">
        <div class="gallery" id="gallery" aria-label="House pictures"></div>
        <section class="panel">
          <header><h2>About this house</h2></header>
          <div class="body" id="h-about"></div>
        </section>
      </div>

      <aside class="col">
        <section class="panel agent-box" id="agent-panel"></section>
      </aside>
    </div>
  </div>
</div>
<script src="/frontend/js/api.js"></script>
<script src="/frontend/js/nav.js"></script>
<script src="/frontend/js/ui.js"></script>
<script src="/frontend/js/house.js"></script>
<script src="/frontend/js/pwa.js"></script>
</body>
</html>
