<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/frontend/nysc-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<link rel="stylesheet" href="/frontend/css/base.css">
<link rel="stylesheet" href="/frontend/css/app.css">
<link rel="stylesheet" href="/frontend/css/extra.css">
<title>NYSC Companion · Houses for rent</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#014a21">
<link rel="apple-touch-icon" href="/frontend/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NYSC">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<div class="view">
  <div id="topbar"></div>
  <div class="page-head">
    <div><h1>Houses for rent</h1><p id="sub">Houses posted by agents around your PPA. Rents are per year.</p></div>
    <span class="pill" id="count"></span>
  </div>
  <div class="notice warn page-note show" id="no-ppa" hidden>Save your PPA on the <a class="link" href="/ppa-locator">PPA Locator page</a> first. Houses are shown around your PPA only.</div>

  <section class="panel" aria-label="Filter">
    <div class="body">
      <form class="filters" id="search-form" novalidate>
        <div class="field"><label for="s-town">Town or area</label><input class="input" id="s-town" placeholder="Any in my LGA"></div>
        <div class="field"><label for="s-rent">Max rent / year</label><input class="input num" id="s-rent" type="number" min="0" step="any" placeholder="Any"></div>
        <div class="field"><label for="s-rooms">Rooms</label><select class="input" id="s-rooms"><option value="">Any</option><option value="1">1+</option><option value="2">2+</option><option value="3">3+</option></select></div>
        <button class="btn" type="submit">Filter</button>
      </form>
    </div>
  </section>

  <div class="cards" id="results" aria-live="polite" style="margin-top:16px"></div>
</div>
<script src="/frontend/js/api.js"></script>
<script src="/frontend/js/nav.js"></script>
<script src="/frontend/js/ui.js"></script>
<script src="/frontend/js/houses.js"></script>
<script src="/frontend/js/pwa.js"></script>
</body>
</html>
