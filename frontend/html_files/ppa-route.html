<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/frontend/nysc-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">

<!-- Map libraries: Leaflet (the map) and Leaflet Routing Machine (the road route) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.min.js"></script>

<link rel="stylesheet" href="/frontend/css/base.css">
<link rel="stylesheet" href="/frontend/css/app.css">
<title>NYSC Companion · Map Route</title>
<style>
  #map-viewport-canvas { width: 100%; height: 460px; background: #e2e8f0; border-radius: 0 0 12px 12px; }
  .leaflet-routing-container { display: none; }   /* hide the turn-by-turn list, keep the line */
  .subnav { display: flex; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 8px; margin: 20px 0 8px; overflow-x: auto; }
  .subnav a { color: var(--muted); font-weight: 600; text-decoration: none; padding-bottom: 8px; white-space: nowrap; }
  .subnav a.active { color: var(--green); font-weight: 700; border-bottom: 2px solid var(--green); }
</style>
</head>
<body>
<div class="view">
  <div id="topbar"></div>

  <nav class="subnav">
    <a href="/home">⌂ Home</a>
    <a href="/expenses">Expense Tracker</a>
    <a class="active" href="/ppa-locator">PPA Locator</a>
    <a href="/houses">Houses for Rent</a>
    <a href="/agents">House Agents</a>
  </nav>

  <div class="notice" id="live-distance-badge" role="status"></div>

  <section class="panel" style="margin-top: 16px;">
    <header>
      <h2 id="route-map-title">📍 Route to your PPA</h2>
      <span class="hint">The road between where you are now and your PPA</span>
    </header>
    <div id="map-viewport-canvas"></div>
  </section>

  <div style="text-align: center; margin-top: 16px;">
    <a href="/ppa-locator" class="btn ghost sm">⇠ Back to PPA settings</a>
  </div>
</div>

<script src="/frontend/js/api.js"></script>
<script src="/frontend/js/nav.js"></script>
<script src="/frontend/js/map.js"></script>
<script src="/frontend/js/ppa-route.js"></script>
</body>
</html>
