<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#014a21">
<link rel="icon" href="/frontend/nysc-logo.png">
<title>NYSC Companion · Offline</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f4f6f3; color: #14231a; }
  main { max-width: 380px; text-align: center; }
  img { width: 64px; height: auto; }
  h1 { font-size: 22px; margin: 14px 0 8px; }
  p { margin: 0 0 18px; color: #4b5b51; line-height: 1.5; }
  a, button { display: inline-block; font: inherit; font-weight: 600; background: #01652d; color: #fff; border: 0; border-radius: 10px; padding: 11px 20px; text-decoration: none; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/frontend/nysc-logo.png" alt="">
  <h1>You are offline</h1>
  <p>This page was not saved on your phone yet. Pages you have opened before still work without data. Connect to the internet, then try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
