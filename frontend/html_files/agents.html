<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/frontend/nysc-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<link rel="stylesheet" href="/frontend/css/base.css">
<link rel="stylesheet" href="/frontend/css/app.css">
<title>NYSC Companion · House agents</title>
</head>
<body>
<div class="view">
  <div id="topbar"></div>
  <div class="page-head">
    <div><h1>House agents</h1><p>Agents who cover the area around your PPA.</p></div>
    <span class="pill" id="count"></span>
  </div>
  <div class="notice warn page-note" id="no-ppa" hidden>Save your PPA on the <a class="link" href="/home">Home page</a> and this search will start around it.</div>

  <section class="panel" aria-label="Search">
    <div class="body">
      <form class="filters" id="search-form" novalidate>
        <div class="field"><label for="s-state">State</label><select class="input" id="s-state"></select></div>
        <div class="field"><label for="s-lga">LGA</label><input class="input" id="s-lga" placeholder="Any"></div>
        <div class="field"><label for="s-town">Town or area</label><input class="input" id="s-town" placeholder="Any"></div>
        <button class="btn" type="submit">Search</button>
      </form>
    </div>
  </section>

  <div class="grid">
    <div class="cards" id="results" aria-live="polite"></div>

    <section class="panel" aria-labelledby="h-me">
      <header><h2 id="h-me">List yourself as an agent</h2></header>
      <div class="body">
        <form class="stack" id="agent-form" style="margin-top:0" novalidate>
          <div class="field" id="f-aname"><label for="a-name">Your name</label><input class="input" id="a-name" maxlength="60"><span class="err">Required.</span></div>
          <div class="field"><label for="a-agency">Agency <span class="opt">(optional)</span></label><input class="input" id="a-agency" maxlength="80"></div>
          <div class="field" id="f-aphone"><label for="a-phone">Phone (also used for WhatsApp)</label><input class="input" id="a-phone" type="tel" inputmode="numeric" placeholder="08030000000"><span class="err">11-digit number.</span></div>
          <div class="row2">
            <div class="field" id="f-astate"><label for="a-state">State</label><select class="input" id="a-state"></select><span class="err">Choose a state.</span></div>
            <div class="field" id="f-alga"><label for="a-lga">Main LGA</label><input class="input" id="a-lga" maxlength="60"><span class="err">Required.</span></div>
          </div>
          <div class="field"><label for="a-towns">Areas you cover <span class="opt">(comma separated)</span></label><input class="input" id="a-towns" maxlength="200" placeholder="e.g. Gboko, Yandev, Aliade"></div>
          <div class="field"><label for="a-about">About you <span class="opt">(optional)</span></label><input class="input" id="a-about" maxlength="300"></div>
          <div class="between"><button class="btn danger sm" type="button" id="a-remove" hidden>Remove my listing</button><button class="btn" type="submit" id="a-save">List me</button></div>
        </form>
        <div class="notice" id="a-notice" role="status"></div>
      </div>
    </section>
  </div>
</div>
<script src="/frontend/js/api.js"></script>
<script src="/frontend/js/nav.js"></script>
<script src="/frontend/js/agents.js"></script>
</body>
</html>
