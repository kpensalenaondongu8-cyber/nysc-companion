<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/frontend/nysc-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<link rel="stylesheet" href="/frontend/css/base.css">
<link rel="stylesheet" href="/frontend/css/app.css">
<link rel="stylesheet" href="/frontend/css/extra.css">
<title>NYSC Companion · House agents</title>
</head>
<body>
<div class="view">
  <div id="topbar"></div>
  <div class="page-head">
    <div><h1>House agents</h1><p id="sub">Agents who cover your area, with ratings from former corps members.</p></div>
    <span class="pill" id="count"></span>
  </div>
  <div class="notice warn page-note show" id="no-ppa" hidden>Save your PPA on the <a class="link" href="/home">Home page</a> and this list will start around it.</div>

  <section class="panel" aria-label="Search">
    <div class="body">
      <form class="filters" id="search-form" novalidate>
        <div class="field"><label for="s-state">State</label>
          <select class="input" id="s-state">
            <option value="">Any state</option>
            <option>Abia</option>
            <option>Adamawa</option>
            <option>Akwa Ibom</option>
            <option>Anambra</option>
            <option>Bauchi</option>
            <option>Bayelsa</option>
            <option>Benue</option>
            <option>Borno</option>
            <option>Cross River</option>
            <option>Delta</option>
            <option>Ebonyi</option>
            <option>Edo</option>
            <option>Ekiti</option>
            <option>Enugu</option>
            <option>FCT</option>
            <option>Gombe</option>
            <option>Imo</option>
            <option>Jigawa</option>
            <option>Kaduna</option>
            <option>Kano</option>
            <option>Katsina</option>
            <option>Kebbi</option>
            <option>Kogi</option>
            <option>Kwara</option>
            <option>Lagos</option>
            <option>Nasarawa</option>
            <option>Niger</option>
            <option>Ogun</option>
            <option>Ondo</option>
            <option>Osun</option>
            <option>Oyo</option>
            <option>Plateau</option>
            <option>Rivers</option>
            <option>Sokoto</option>
            <option>Taraba</option>
            <option>Yobe</option>
            <option>Zamfara</option>
          </select></div>
        <div class="field"><label for="s-lga">LGA</label><input class="input" id="s-lga" placeholder="Any"></div>
        <div class="field"><label for="s-town">Town or area</label><input class="input" id="s-town" placeholder="Any"></div>
        <button class="btn" type="submit">Search</button>
      </form>
    </div>
  </section>

  <div class="cards" id="results" aria-live="polite" style="margin-top:16px"></div>
  <p class="hint-small" style="margin-top:16px">Are you a house agent? <a class="link" href="/register">Create an agent account</a> to post your houses with pictures.</p>
</div>
<script src="/frontend/js/api.js"></script>
<script src="/frontend/js/nav.js"></script>
<script src="/frontend/js/ui.js"></script>
<script src="/frontend/js/agents.js"></script>
</body>
</html>
